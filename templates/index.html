<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Analyzer</title>
</head>
<body>
    <h1> Rhyme Analyzer</h1>
    <form method="POST">
        <textarea name="lyrics" rows="8" cols="50" placeholder="Paste lyrics here, one bar per line"></textarea>
        <br>
        <button type="submit">Analyze</button>
    </form>
    {% if pattern %}
        <h2>Rhyme Pattern</h2>
        <p> {{ pattern }}</p>

        <h2>Syllable Counts</h2>
        <ul>
        {% for i in range(lines|length) %}
            <li>{{ lines[i] }}: {{syllables[i]}} syllables</li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
